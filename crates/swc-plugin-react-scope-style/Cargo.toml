[package]
name = "swc_plugin_react_scope_style"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SWC plugin for babel-preset-react-scope-style (Phase B1: inject-scope + transform-class)."
repository = "https://github.com/gxlmyacc/babel-preset-react-scope-style"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
# Pinned for Next.js 14.2.x embedded SWC ABI — bump only with documented Next matrix
# See https://plugins.swc.rs/ and docs/phase-b-swc.md
swc_core = { version = "0.90.37", features = [
  "ecma_plugin_transform",
  "ecma_visit",
  "ecma_utils",
  "ecma_ast",
  "common",
] }

[profile.release]
lto = true
opt-level = "s"
strip = "symbols"
