name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # 运行时冒烟：覆盖 engines.node >=14.17（完整单测依赖 node:test，需 Node 18+）
  smoke-node14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 14.17
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime smoke
        run: npm run smoke:runtime

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Coverage
        if: matrix.node-version != '18'
        run: npm run test:coverage

  lint-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Stylelint
        run: npm run lint:style

  # 示例真实构建：覆盖 file: 链接 + 各 bundler 生产构建路径
  examples-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [webpack, vite, next-app, esbuild-bundle, esbuild-lib]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install package dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: examples/${{ matrix.example }}
        run: npm install

      - name: Build example
        working-directory: examples/${{ matrix.example }}
        run: npm run build
